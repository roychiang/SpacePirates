      <h1>Space Pirates — Multiplayer 3D Space Combat Game</h1>
      <p>Space Pirates is a free, browser-based multiplayer 3D space shooter built with Babylon.js and WebGL. No download required — play instantly in any modern web browser.</p>

      <h2>Game Features</h2>
      <ul>
        <li><strong>Single Player</strong>: Battle AI-controlled enemy ships across challenging missions</li>
        <li><strong>Co-op Multiplayer</strong>: Team up with friends in real-time peer-to-peer space combat</li>
        <li><strong>Global Leaderboards</strong>: Compete for the highest score, most kills, and longest win streaks</li>
        <li><strong>3D Space Combat</strong>: Stunning WebGL graphics with post-processing effects</li>
        <li><strong>VIVERSE Integration</strong>: Social login, avatars, and cross-platform play</li>
        <li><strong>Controller Support</strong>: Full gamepad support alongside keyboard and mouse</li>
      </ul>

      <h2>How to Play</h2>
      <p>Use WASD or Arrow Keys to maneuver your ship. Aim and fire with the mouse. Press Spacebar for boost. Full gamepad support is also available.</p>

      <h2>About</h2>
      <p>Originally created as a demo for the Babylon.js 5.0 release, Space Pirates has grown into a fully-featured multiplayer space combat game. The game uses Colyseus for real-time game state synchronization and PeerJS for peer-to-peer co-op gameplay.</p>
