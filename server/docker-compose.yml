version: '3'
services:
  server:
    build: .
    expose:
      - "2567"
    environment:
      - SP_DEV_API_KEY
      - TALO_ACCESS_KEY
      - SP_JWT_PUBLIC_KEY
      - SP_JWT_PRIVATE_KEY
      - VIVERSE_CLIENT_ID
      - VIVERSE_CLIENT_SECRET
    restart: always
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SPACEPIRATES_DOMAIN=www.spacepirates.app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../docs:/srv/spacepirates:ro
    depends_on:
      - server
